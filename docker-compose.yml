# docker-compose.yml
#
# PURPOSE: Define and wire up all infrastructure services needed for the pipeline.
#
# SERVICES TO DECLARE:
#
#  zookeeper
#    - Required by Kafka for cluster coordination.
#    - Expose internal port 2181.
#
#  kafka
#    - Message broker; expose port 9092 to the host.
#    - Set KAFKA_ZOOKEEPER_CONNECT pointing at zookeeper.
#    - Set KAFKA_ADVERTISED_LISTENERS so the producer and Spark can reach it.
#    - Add a healthcheck so dependent services wait until Kafka is ready.
#
#  kafka-ui  (optional)
#    - Web UI to inspect topics and consumer groups.
#    - Expose port 8085 (or any free port).
#
#  minio
#    - S3-compatible object storage used as the Hudi data lake root.
#    - Expose ports 9000 (API) and 9001 (console).
#    - Set MINIO_ROOT_USER and MINIO_ROOT_PASSWORD via environment variables.
#    - Mount ./data as a volume for local FS mode (alternative to true S3).
#
#  postgres
#    - Backend database for Airflow metadata (and optionally Grafana).
#    - Expose port 5432 internally.
#    - Set POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB.
#    - Add a healthcheck (pg_isready) so Airflow waits before starting.
#
#  airflow-init
#    - One-off service (restart: on-failure) that runs:
#        airflow db init && airflow users create (admin user)
#    - Depends on postgres being healthy.
#
#  airflow-webserver
#    - Airflow UI on port 8080.
#    - Depends on airflow-init completing successfully.
#    - Mount ./airflow/dags into /opt/airflow/dags.
#
#  airflow-scheduler
#    - Airflow scheduler that triggers DAGs.
#    - Shares the same DAGs volume as the webserver.
#    - Depends on airflow-init.
#
#  spark-master  (optional — use spark-submit directly if preferred)
#    - Spark standalone master node.
#    - Expose port 7077 (Spark) and 8081 (web UI).
#
#  spark-worker  (optional)
#    - One or more Spark workers attached to spark-master.
#    - Set SPARK_MASTER_URL=spark://spark-master:7077.
#    - Mount ./data and ./models so the lake and KMeans model are accessible.
#
#  grafana
#    - Visualization layer on port 3000.
#    - Mount ./grafana/provisioning into /etc/grafana/provisioning.
#    - Mount ./grafana/dashboards into /etc/grafana/dashboards.
#    - Set GF_SECURITY_ADMIN_PASSWORD via environment variable.
#
# GENERAL NOTES:
#  - Create a single shared Docker network (e.g., "crypto-net") so every service
#    can resolve each other by hostname.
#  - Mount ./data as a shared volume into Spark, MinIO and Airflow so all layers
#    read and write the same lake root (LAKE_PATH=./data).
#  - Use a .env file for secrets (passwords, ports) and reference them with ${VAR}.
#  - Set the KAFKA_BOOTSTRAP, LAKE_PATH, WATERMARK, WINDOW, SLIDE env vars
#    as defined in the README configuration table.
